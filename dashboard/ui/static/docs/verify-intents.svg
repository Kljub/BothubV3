<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="330" rx="14" fill="#141414"/>
  <text x="30" y="36" fill="#7d7d7d" font-size="12">Schematic · App Verification → privileged intents: what BotHub uses them for</text>
  <g font-size="12">
    <g transform="translate(30,56)">
      <rect width="290" height="244" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
      <text x="18" y="32" fill="#e8e8e8" font-size="15" font-weight="700">Server Members</text>
      <rect x="18" y="46" width="70" height="20" rx="10" fill="#2a2440"/><text x="53" y="60" fill="#a78bfa" font-size="11" text-anchor="middle">Request</text>
      <text x="18" y="94" fill="#b5b5b5">Welcome / leave messages,</text>
      <text x="18" y="112" fill="#b5b5b5">auto roles, verification,</text>
      <text x="18" y="130" fill="#b5b5b5">sticky roles, invite tracker,</text>
      <text x="18" y="148" fill="#b5b5b5">member counters, overview</text>
      <text x="18" y="166" fill="#b5b5b5">(new members, active users).</text>
      <text x="18" y="214" fill="#7d7d7d" font-size="11">Only switched-on modules use it.</text>
    </g>
    <g transform="translate(335,56)">
      <rect width="290" height="244" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
      <text x="18" y="32" fill="#e8e8e8" font-size="15" font-weight="700">Message Content</text>
      <rect x="18" y="46" width="70" height="20" rx="10" fill="#2a2440"/><text x="53" y="60" fill="#a78bfa" font-size="11" text-anchor="middle">Request</text>
      <text x="18" y="94" fill="#b5b5b5">AutoMod filters, auto responder,</text>
      <text x="18" y="112" fill="#b5b5b5">counting, link fixes, global chat,</text>
      <text x="18" y="130" fill="#b5b5b5">modmail, AI chat answers,</text>
      <text x="18" y="148" fill="#b5b5b5">custom message events.</text>
      <text x="18" y="214" fill="#7d7d7d" font-size="11">Read when a message arrives.</text>
    </g>
    <g transform="translate(640,56)">
      <rect width="290" height="244" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
      <text x="18" y="32" fill="#e8e8e8" font-size="15" font-weight="700">Presence</text>
      <rect x="18" y="46" width="90" height="20" rx="10" fill="#222"/><text x="63" y="60" fill="#b5b5b5" font-size="11" text-anchor="middle">If you need it</text>
      <text x="18" y="94" fill="#b5b5b5">Online member counters and</text>
      <text x="18" y="112" fill="#b5b5b5">events on status changes.</text>
      <text x="18" y="160" fill="#b5b5b5">Not needed? Do not request</text>
      <text x="18" y="178" fill="#b5b5b5">it: BotHub then runs</text>
      <text x="18" y="196" fill="#b5b5b5">without it.</text>
    </g>
  </g>
</svg>
