{{/* Moderation module settings. Receives a moderationView. Saved through the save bar. */}}
{{define "moderation_settings"}}
{{$c := .Config}}
{{/* Attributes, not <script> blocks: hx-boost drops script tags of swapped pages. */}}
{{with .Picker}}<div hidden data-picker-data="{{printf "%s" .}}" data-picker-texts="{{printf "%s" pickerTexts}}"></div>{{end}}
<form class="form" id="moderation-settings" hx-put="/bot/{{.BotID}}/modules/moderation/config" hx-target="#flash" data-savebar>
  {{/* Servers whose roles and channels loaded; only these are replaced on save. */}}
  {{range .Guilds}}{{if not .Failed}}<input type="hidden" name="loaded_guild" value="{{.ID}}">{{end}}{{end}}
  <section class="box">
    <header class="box-head">
      <h2>{{t "moderation.access.title"}}</h2>
      <span class="box-meta">{{t "moderation.access.meta"}}</span>
    </header>
    <div class="box-body form">
      {{template "moderation_block" (list "moderators" .Moderators)}}
      {{template "moderation_block" (list "admins" .Admins)}}
    </div>
  </section>

  <section class="box">
    <header class="box-head">
      <h2>{{t "moderation.log.title"}}</h2>
      <span class="box-meta">{{t "moderation.log.meta"}}</span>
    </header>
    <div class="box-body form">
      <label class="toggle-row">
        <span><strong>{{t "moderation.log.enable"}}</strong><span class="hint">{{t "moderation.log.enable_hint"}}</span></span>
        <input type="checkbox" class="toggle" name="log_enabled" value="true" {{if $c.LogEnabled}}checked{{end}}>
      </label>
      {{range .Guilds}}
      <label class="field">{{t "moderation.log.channel" "server" .Name}}
        <select name="log_channel_{{.ID}}" class="input-medium" data-pick="channel" data-guild="{{.ID}}" data-channel-types="text,announcement">
          <option value="">{{t "moderation.log.channel_none"}}</option>
          {{$sel := .LogChannel}}{{$g := .ID}}
          {{range .Channels}}{{if or (eq .Type "text") (eq .Type "announcement")}}<option value="{{$g}}:{{.ID}}" data-name="{{.Name}}" data-type="{{.Type}}" {{if eq .ID $sel}}selected{{end}}>#{{.Name}}</option>{{end}}{{end}}
        </select>
        {{if .Failed}}<span class="hint">{{t "moderation.server_unreachable"}}</span>{{end}}
      </label>
      {{else}}
      <p class="muted">{{t "moderation.no_servers"}}</p>
      {{end}}
      <label class="field">{{t "moderation.log.color"}}
        <input type="color" name="log_color" value="{{$c.LogColor}}" class="input-small">
      </label>
    </div>
  </section>

  <section class="box">
    <header class="box-head">
      <h2>{{t "moderation.dm.title"}}</h2>
      <span class="box-meta">{{t "moderation.dm.meta"}}</span>
    </header>
    <div class="box-body form">
      <label class="toggle-row">
        <span><strong>{{t "moderation.dm.enable"}}</strong><span class="hint">{{t "moderation.dm.enable_hint"}}</span></span>
        <input type="checkbox" class="toggle" name="dm_enabled" value="true" {{if $c.DMEnabled}}checked{{end}}>
      </label>
      <div class="field">
        <span class="field-label">{{t "moderation.dm.mode"}}</span>
        <div class="chips">
          {{range list "embed" "text"}}<label class="chip"><input type="radio" name="dm_mode" value="{{.}}" {{if eq . $c.DMMode}}checked{{end}}> {{t (printf "moderation.dm.mode_%s" .)}}</label>{{end}}
        </div>
      </div>
      <label class="field">{{t "moderation.dm.message"}}
        <textarea name="dm_message" rows="6" maxlength="2000" required data-counter="moderation-dm-count">{{$c.DMMessage}}</textarea>
        <span class="hint">{{t "moderation.dm.variables"}} <span class="mono">{action} {moderator} {time} {case} {reason} {server}</span> · <span id="moderation-dm-count">{{len $c.DMMessage}}/2000</span></span>
      </label>
      <label class="field">{{t "moderation.dm.color"}}
        <input type="color" name="punishment_color" value="{{$c.PunishmentColor}}" class="input-small">
        <span class="hint">{{t "moderation.dm.color_hint"}}</span>
      </label>
    </div>
  </section>

  <section class="box">
    <header class="box-head">
      <h2>{{t "moderation.ban.title"}}</h2>
    </header>
    <div class="box-body form">
      <label class="field">{{t "moderation.ban.delete_messages"}}
        <select name="ban_delete_messages" class="input-medium">
          {{range .DeleteOptions}}<option value="{{.}}" {{if eq . $c.BanDeleteMessages}}selected{{end}}>{{t (printf "builder.enum.delete_messages.%s" .)}}</option>{{end}}
        </select>
        <span class="hint">{{t "moderation.ban.delete_messages_hint"}}</span>
      </label>
    </div>
  </section>

  <section class="box">
    <header class="box-head">
      <h2>{{t "moderation.auto.title"}}</h2>
      <span class="box-meta">{{t "moderation.auto.meta"}}</span>
    </header>
    <div class="box-body form">
      <p class="hint hint-top">{{t "moderation.auto.hint"}}</p>
      <div class="rows" data-rows>
        {{range $c.AutoPunishments}}{{template "moderation_rule" .}}{{end}}
      </div>
      <template data-row-template>{{template "moderation_rule" .NewRule}}</template>
      <div><button type="button" class="btn btn-sm" data-add-row>+ {{t "moderation.auto.add"}}</button></div>
    </div>
  </section>
</form>
{{end}}

{{/* Who counts as moderator or admin: a permissions block (static/js/modsettings.js).
     Receives (list name json); texts come from permblock.moderation.<name>.*. */}}
{{define "moderation_block"}}
{{$name := index . 0}}
<div class="field">
  <span class="field-label">{{t (printf "moderation.access.%s" $name)}}</span>
  <span class="hint hint-top">{{t (printf "moderation.access.%s_hint" $name)}}</span>
  <input type="hidden" name="{{$name}}" value="{{index . 1}}">
  <div data-perm-block data-no-everyone data-no-badge data-texts="permblock.moderation.{{$name}}"></div>
</div>
{{end}}

{{/* One automatic punishment. Receives an api.AutoPunishment. */}}
{{define "moderation_rule"}}
<div class="row-entry">
  <select name="rule_trigger" aria-label="{{t "moderation.auto.trigger"}}">
    {{range list "warnings" "timeouts"}}<option value="{{.}}" {{if eq . $.Trigger}}selected{{end}}>{{t (printf "moderation.auto.trigger_%s" .)}}</option>{{end}}
  </select>
  <input type="number" name="rule_count" min="1" max="100" required value="{{.Count}}" class="input-small" aria-label="{{t "moderation.auto.count"}}">
  <select name="rule_action" aria-label="{{t "moderation.auto.action"}}">
    {{range list "timeout" "kick" "ban"}}<option value="{{.}}" {{if eq . $.Action}}selected{{end}}>{{t (printf "moderation.auto.action_%s" .)}}</option>{{end}}
  </select>
  <input name="rule_duration" maxlength="6" pattern="[1-9][0-9]{0,4}[smhd]" value="{{.Duration}}" placeholder="{{t "moderation.auto.duration_placeholder"}}" class="input-small mono" aria-label="{{t "moderation.auto.duration"}}">
  <button type="button" class="icon-btn" data-remove-row aria-label="{{t "action.remove"}}">×</button>
</div>
{{end}}
