# BotHub: three containers.
#   app    dashboard (the only public port), gateway, PHP API, outbox relay
#   bot    the bot core (all bots, modules, plugin sandbox)
#   redis  events between API and bot, cache
# All persistent data lives in ./data (mounted as /data). Optional updates
# from the dashboard: docker-compose.update.yml.

name: bothub

services:
  app:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      TZ: "${TZ:-UTC}"
      DATA_DIR: "/data"
      REDIS_URL: "redis://redis:6379"
      BOTHUB_DEFAULT_LOCALE: "${BOTHUB_DEFAULT_LOCALE:-en}"
      # Shared secret between gateway and API (/internal/*), at least 32 characters.
      BOTHUB_INTERNAL_KEY: "${BOTHUB_INTERNAL_KEY:-}"
      # Optional first admin (plain text or Argon2id hash).
      BOTHUB_ADMIN_USER: "${BOTHUB_ADMIN_USER:-}"
      BOTHUB_ADMIN_PASSWORD: "${BOTHUB_ADMIN_PASSWORD:-}"
      # Passkeys: the domain and the address the browser uses.
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-localhost}"
      WEBAUTHN_ORIGINS: "${WEBAUTHN_ORIGINS:-http://localhost:${DASHBOARD_PORT:-8080}}"
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/healthz') === false || @file_get_contents('http://127.0.0.1:9000/api/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment:
      TZ: "${TZ:-UTC}"
      DATA_DIR: "/data"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data/redis"]
    volumes:
      - ./data:/data
    # Bypass the image entrypoint: it drops to the redis user, which cannot
    # write to a Windows bind mount. Redis runs as root here.
    entrypoint: ["sh", "-c", "mkdir -p /data/redis && exec \"$$@\"", "--"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
